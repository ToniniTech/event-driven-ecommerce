name: Deploy to AWS EC2

on:
  workflow_dispatch:
    inputs:
      confirm_deployment:
        description: Type DEPLOY to publish images and update EC2
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-ec2-deployment
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
  EC2_APP_DIR: ${{ vars.EC2_APP_DIR }}

jobs:
  preflight:
    name: Validate deployment configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require explicit deployment confirmation
        env:
          CONFIRM_DEPLOYMENT: ${{ inputs.confirm_deployment }}
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          set -Eeuo pipefail
          test "$CONFIRM_DEPLOYMENT" = "DEPLOY" || {
            echo "The confirmation value must be exactly DEPLOY." >&2
            exit 1
          }

          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "Production deployments must be dispatched from main; current ref: $GITHUB_REF" >&2
            exit 1
          }

          for variable_name in AWS_REGION AWS_DEPLOY_ROLE_ARN EC2_INSTANCE_ID EC2_APP_DIR; do
            test -n "${!variable_name:-}" || {
              echo "Missing required GitHub Actions variable: $variable_name" >&2
              exit 1
            }
          done

  build-and-push:
    name: Test and publish ${{ matrix.service }}
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - order-service
          - notification-service
          - payment-service
          - product-service
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml

      - name: Build and test
        working-directory: ${{ matrix.service }}
        run: mvn --batch-mode verify

      - name: Configure temporary AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sign in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push immutable image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ matrix.service }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy immutable release through SSM
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Configure temporary AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve AWS account and ECR registry
        id: aws
        run: |
          set -Eeuo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          echo "registry=${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com" >> "$GITHUB_OUTPUT"

      - name: Verify that EC2 is online in Systems Manager
        run: |
          set -Eeuo pipefail
          ping_status="$(aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=${EC2_INSTANCE_ID}" \
            --query 'InstanceInformationList[0].PingStatus' \
            --output text)"

          test "$ping_status" = "Online" || {
            echo "EC2 instance ${EC2_INSTANCE_ID} is not Online in Systems Manager (status: ${ping_status})." >&2
            exit 1
          }

      - name: Send deployment command
        id: deploy
        env:
          ECR_REGISTRY: ${{ steps.aws.outputs.registry }}
        run: |
          set -Eeuo pipefail

          parameters="$(jq -cn \
            --arg app_dir "$EC2_APP_DIR" \
            --arg repository "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" \
            --arg revision "$GITHUB_SHA" \
            --arg region "$AWS_REGION" \
            --arg registry "$ECR_REGISTRY" \
            '{commands: [
              "set -Eeuo pipefail",
              "export HOME=/root",
              ("test -d " + ($app_dir | @sh) + "/.git || { echo Missing deployment repository >&2; exit 1; }"),
              ("git config --global --add safe.directory " + ($app_dir | @sh)),
              ("cd " + ($app_dir | @sh)),
              "test -f .env || { echo Missing production .env >&2; exit 1; }",
              ("git fetch --quiet " + ($repository | @sh) + " " + ($revision | @sh)),
              ("git checkout --detach " + ($revision | @sh)),
              "chmod +x scripts/deployment/remote-deploy.sh scripts/deployment/verify-health.sh",
              ("AWS_REGION=" + ($region | @sh) + " ECR_REGISTRY=" + ($registry | @sh) + " IMAGE_TAG=" + ($revision | @sh) + " ./scripts/deployment/remote-deploy.sh")
            ]}')"

          command_id="$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy $GITHUB_REPOSITORY@$GITHUB_SHA" \
            --timeout-seconds 900 \
            --parameters "$parameters" \
            --query 'Command.CommandId' \
            --output text)"

          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"
          echo "Started SSM command: $command_id"

      - name: Wait for deployment result
        env:
          COMMAND_ID: ${{ steps.deploy.outputs.command_id }}
        run: |
          set -Eeuo pipefail

          terminal_status=""
          for attempt in $(seq 1 90); do
            status="$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null || echo Pending)"

            case "$status" in
              Success|Cancelled|TimedOut|Failed|Cancelling)
                terminal_status="$status"
                break
                ;;
            esac

            echo "SSM deployment status: $status (${attempt}/90)"
            sleep 10
          done

          result="$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID")"

          echo "## EC2 deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- SSM command: \`$COMMAND_ID\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Status: \`${terminal_status:-unknown}\`" >> "$GITHUB_STEP_SUMMARY"

          echo "$result" | jq -r '.StandardOutputContent'
          echo "$result" | jq -r '.StandardErrorContent' >&2

          test "$terminal_status" = "Success"
