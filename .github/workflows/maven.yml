name: CI for ecommerce-events

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
      

jobs:
  build-and-test:
    name: Build and test ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - order-service
          - notification-service
          - payment-service
          - product-service
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml

      - name: Build and test
        working-directory: ${{ matrix.service }}
        run: mvn --batch-mode verify

      - name: Build Docker image
        working-directory: ${{ matrix.service }}
        run: docker build --tag ecommerce/${{ matrix.service }}:${{ github.sha }} .
